---
secrets:
  config_json:
    file: secrets.json

services:
  foundry:
    image: felddy/foundryvtt:${VERSION}
    hostname: localhost
    # The user Foundry VTT runs as, which must own ./data. The serve:vtt script passes its own.
    user: ${HOST_UID:-1000}:${HOST_GID:-1000}
    volumes:
      - type: bind
        source: ./data
        target: /data
      # Only what Foundry VTT loads, as the release package lays it out. The whole of packages/module would bring in its
      # node_modules too, whose links point outside it and so break Foundry's snapshots, and its sources and coverage.
      - type: bind
        source: ../packages/module/module.json
        target: /data/Data/modules/mondarth-emma/module.json
        read_only: true
      - type: bind
        source: ../packages/module/dist
        target: /data/Data/modules/mondarth-emma/dist
        read_only: true
    environment:
      - CONTAINER_PRESERVE_CONFIG=true
      - FOUNDRY_HOT_RELOAD=true
    ports:
      - target: 30000
        published: 30000
        protocol: tcp
    secrets:
      - source: config_json
        target: config.json
