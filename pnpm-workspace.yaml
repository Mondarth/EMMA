blockExoticSubdeps: false
allowBuilds:
  # fvtt-types follows its main branch, so it is approved by its repository, not by one commit's tarball, which stops
  # matching whenever main moves. A bare package name cannot approve a git-hosted build (pnpm/pnpm#12294).
  "@league-of-foundry-developers/foundry-vtt-types@git+https://github.com/League-of-Foundry-Developers/foundry-vtt-types.git": true
  "@parcel/watcher": true
  esbuild: true
  foundry-vtt-types: true
  svelte-preprocess: true
minimumReleaseAgeExclude:
  # The resolver is the maintainer's own package, released and adopted the same day.
  - "@mondarth/fvtt-resolver"
  # The catalogue's contract, which the resolver depends on, is the maintainer's own too.
  - "@mondarth/fvtt-package-catalogue-contract"
# The Foundry module and, to come, the browser extension and the code it injects. Tooling shared by all of them is a
# development dependency of the workspace root, which every package resolves from.
packages:
  - packages/*
