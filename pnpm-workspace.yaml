blockExoticSubdeps: false
allowBuilds:
  "@league-of-foundry-developers/foundry-vtt-types@https://codeload.github.com/League-of-Foundry-Developers/foundry-vtt-types/tar.gz/27bf7b9bac68a74a5346c7ca44432917d9f41bdb": true
  "@parcel/watcher": true
  esbuild: true
  foundry-vtt-types: true
  svelte-preprocess: true
minimumReleaseAgeExclude:
  # The resolver is the maintainer's own package, released and adopted the same day.
  - "@mondarth/fvtt-resolver"
  # The catalogue's contract, which the resolver depends on, is the maintainer's own too.
  - "@mondarth/fvtt-package-catalogue-contract"
