# Throwaway Foundry VTT server for the end-to-end tests.
#
# Takes its credentials from a JSON secrets file, by default the development server's .foundryvtt/secrets.json (see
# .foundryvtt/secrets.example.json), or another named by FOUNDRY_SECRETS_FILE. A key missing from the file falls back to
# the environment variable: FOUNDRY_USERNAME, FOUNDRY_PASSWORD, FOUNDRY_LICENSE_KEY or FOUNDRY_ADMIN_KEY. CI sets those
# and points FOUNDRY_SECRETS_FILE at an empty file.
# Prepare tests/e2e/.data first with `pnpm run e2e:packages`, and start the server with `pnpm run e2e:server`, which
# makes the directories mounted here before Docker would make them as root.
secrets:
  config_json:
    file: ${FOUNDRY_SECRETS_FILE:-../../../../.foundryvtt/secrets.json}

services:
  foundry:
    # Keep in step with VERSION in .foundryvtt/.env.
    image: felddy/foundryvtt:${FOUNDRY_VERSION:-14.368.0}
    hostname: localhost
    # The image ignores FOUNDRY_UID and FOUNDRY_GID. It runs as this user, which must own .data: the e2e:server script
    # passes its own.
    user: ${HOST_UID:-1000}:${HOST_GID:-1000}
    environment:
      - FOUNDRY_USERNAME
      - FOUNDRY_PASSWORD
      - FOUNDRY_LICENSE_KEY
      - FOUNDRY_ADMIN_KEY
      # Keeps the downloaded server release in /data/container_cache so CI can cache it between runs.
      - CONTAINER_CACHE=/data/container_cache
    secrets:
      - source: config_json
        target: config.json
    volumes:
      - ./.data:/data
      # The module under test: module.json plus the built dist/ from packages/module.
      - ../..:/data/Data/modules/mondarth-emma:ro
    ports:
      # Port 30001 on the host, so a development Foundry VTT can keep port 30000.
      - "30001:30000"
