name: Publish to Foundry VTT

# Publishes a release of the module to Foundry VTT's package listing, through its Package Release API, so that Foundry's
# Setup screen offers it (docs/developers/releases.md). The Release workflow calls it after each module release. It can
# also be run by hand (Actions > Publish to Foundry VTT > Run workflow), for a release made before it existed, or one
# whose publishing failed: the latest module release by default, or the version given.
on:
  workflow_call:
    inputs:
      version:
        description: The module's version released, such as 0.13.1
        type: string
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: The module's version to publish, such as 0.13.1; the latest module release if left empty. Only the module's releases (v<version>) are published, never the extension's
        type: string
        required: false
      dry-run:
        description: Have Foundry VTT check the release without publishing it
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  publish:
    name: Publish the module's release
    runs-on: ubuntu-latest
    steps:
      # The manifest of the version alone: the one its GitHub release attaches, which names that version's own zip.
      - name: Find the release's manifest
        id: manifest
        run: |
          # Only the module's releases, tagged v<version>, are Foundry packages: told apart by their tags alone, never by
          # whether a release is a pre-release, so that the extension's (extension-v<version>) never are, whatever they
          # are marked.
          module_tag='^v[0-9]+[.][0-9]+[.][0-9]+$'
          version="${VERSION#v}"
          if [ -z "$version" ]; then
            # The newest module release, by when it was published.
            version="$(gh release list --repo "$REPOSITORY" --exclude-drafts --limit 100 \
              --json tagName,publishedAt \
              --jq "[.[] | select(.tagName | test(\"${module_tag}\"))] | sort_by(.publishedAt) | last | .tagName // empty" \
              | sed 's/^v//')"
          fi
          if [ -z "$version" ]; then
            echo "::error::No module release found."
            exit 1
          fi
          if ! [[ "v${version}" =~ $module_tag ]]; then
            echo "::error::${VERSION} is not a version of the module, such as 0.13.1."
            exit 1
          fi
          url="https://github.com/${REPOSITORY}/releases/download/v${version}/module.json"
          if ! gh release view "v${version}" --repo "$REPOSITORY" --json assets --jq '.assets[].name' | grep -qx 'module.json'; then
            echo "::error::Release v${version} has no module.json to publish."
            exit 1
          fi
          echo "Publishing ${version} from ${url}"
          echo "url=${url}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ inputs.version }}

      # Foundry VTT's Package Release API (https://foundryvtt.com/article/package-release-api/), asked directly rather
      # through a third-party action, which sent the manifest's own `manifest` field, EMMA's stable URL that always gives
      # the newest version, in place of the manifest of this version alone. The token is the package's, from its page on
      # foundryvtt.com, and is only ever passed in the environment.
      - name: Publish it
        run: |
          manifest="$(mktemp)"
          curl --fail --silent --show-error --location --output "$manifest" "$URL"
          id="$(jq -r .id "$manifest")"
          declared="$(jq -r .version "$manifest")"
          if [ "$declared" != "$VERSION" ]; then
            echo "::error::The manifest at ${URL} is of version ${declared}, not ${VERSION}."
            exit 1
          fi
          body="$(jq -n \
            --arg id "$id" \
            --arg version "$VERSION" \
            --arg manifest "$URL" \
            --arg notes "https://github.com/${REPOSITORY}/releases/tag/v${VERSION}" \
            --argjson compatibility "$(jq '.compatibility // {}' "$manifest")" \
            --argjson dryRun "$DRY_RUN" \
            '{id: $id, release: {version: $version, manifest: $manifest, notes: $notes, compatibility: $compatibility}}
              + (if $dryRun then {"dry-run": true} else {} end)')"
          echo "Asking Foundry VTT to $([ "$DRY_RUN" = true ] && echo 'check, without publishing,' || echo 'publish') this release:"
          echo "$body" | jq .
          response="$(curl --silent --show-error --request POST \
            --header 'Content-Type: application/json' \
            --header "Authorization: ${TOKEN}" \
            --data "$body" \
            https://api.foundryvtt.com/_api/packages/release_version/)"
          echo "Foundry VTT answered:"
          echo "$response" | jq . 2>/dev/null || echo "$response"
          if [ "$(echo "$response" | jq -r '.status // empty' 2>/dev/null)" != 'success' ]; then
            echo "::error::Foundry VTT did not accept the release."
            exit 1
          fi
        env:
          TOKEN: ${{ secrets.FOUNDRY_PACKAGE_RELEASE_TOKEN }}
          URL: ${{ steps.manifest.outputs.url }}
          VERSION: ${{ steps.manifest.outputs.version }}
          REPOSITORY: ${{ github.repository }}
          DRY_RUN: ${{ inputs.dry-run == true }}
