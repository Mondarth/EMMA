name: Extension release

# Publishes an alpha of the browser extension as a GitHub pre-release, tagged `extension-v<version>`, with the version
# from packages/extension/package.json. Started by hand on `main` (Actions > Extension release > Run workflow), after
# raising that version.
#
# Attached to the release:
#   - the Chromium build, zipped, for loading unpacked;
#   - the Firefox build, signed by Mozilla as an unlisted add-on, given the AMO_JWT_ISSUER and AMO_JWT_SECRET secrets
#     (API keys from addons.mozilla.org); without them, unsigned, which Firefox installs only until it restarts.
#
# A pre-release is never GitHub's latest release, so the module's releases are not disturbed.
on:
  workflow_dispatch:

concurrency:
  group: extension-release
  cancel-in-progress: false

permissions:
  contents: read

env:
  HUSKY: "0"

jobs:
  release:
    name: Publish the extension
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      # The release App may create tags on the protected repository; each token expires within an hour.
      - name: Get a release token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup

      - name: Read the version
        id: version
        run: |
          version="$(jq -r .version packages/extension/package.json)"
          if gh release view "extension-v${version}" > /dev/null 2>&1; then
            echo "::error::extension-v${version} is already released; raise the version in packages/extension/package.json"
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Build
        run: pnpm build

      - name: Check the Firefox build
        run: pnpm --filter @mondarth/emma-extension run lint:firefox

      - name: Package the Chromium build
        run: |
          mkdir -p release
          (cd packages/extension/dist/chromium && zip -r -D "../../../../release/emma-extension-chromium-v${VERSION}.zip" .)
        env:
          VERSION: ${{ steps.version.outputs.version }}

      - name: Sign the Firefox build
        if: ${{ env.AMO_JWT_ISSUER != '' && env.AMO_JWT_SECRET != '' }}
        run: |
          pnpm --filter @mondarth/emma-extension exec web-ext sign --channel unlisted \
            --source-dir dist/firefox --artifacts-dir web-ext-artifacts \
            --api-key "$AMO_JWT_ISSUER" --api-secret "$AMO_JWT_SECRET"
          mv packages/extension/web-ext-artifacts/*.xpi "release/emma-extension-firefox-v${VERSION}.xpi"
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
          VERSION: ${{ steps.version.outputs.version }}

      - name: Package the Firefox build unsigned
        if: ${{ env.AMO_JWT_ISSUER == '' || env.AMO_JWT_SECRET == '' }}
        run: |
          echo "::warning::No AMO_JWT_ISSUER and AMO_JWT_SECRET secrets: the Firefox build is unsigned"
          (cd packages/extension/dist/firefox && zip -r -D "../../../../release/emma-extension-firefox-v${VERSION}-unsigned.zip" .)
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
          VERSION: ${{ steps.version.outputs.version }}

      - name: Publish the pre-release
        run: |
          gh release create "extension-v${VERSION}" release/* \
            --prerelease --target "$GITHUB_SHA" \
            --title "EMMA browser extension ${VERSION} (alpha)" \
            --notes "An alpha of the browser extension that brings EMMA to Foundry VTT's setup screen, for testing only. See [installing the browser extension](https://mondarth.github.io/EMMA/extension.html)."
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ steps.version.outputs.version }}
