name: Release

# Pushes to `main` (normally the merge of a pull request from `dev`) are released:
#
#   1. Dev CI runs in full. Nothing is released unless it passes.
#   2. semantic-release releases each package on its own, from the commits that change it (docs/developers/releases.md):
#      the module first, then the browser extension. For each, it works out the version from the commits, stamps and
#      packages the package, commits its changelog and version, tags the commit and publishes the GitHub release.
#   3. If either was released, the documentation is deployed and `dev` is brought up to date with the release commits.
#
# It can also be started by hand on `main` (Actions > Release > Run workflow); it then releases only if there is
# something to release.
on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  HUSKY: "0"

jobs:
  ci:
    name: CI
    # A manual run can be started on any branch; only main is released.
    if: ${{ github.ref == 'refs/heads/main' }}
    uses: ./.github/workflows/dev.yml
    secrets: inherit

  release:
    name: Semantic release
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      module-version: ${{ steps.module.outputs.version }}
      extension-version: ${{ steps.extension.outputs.version }}
    steps:
      # The release App is on the rulesets' bypass list, so its token may push to the protected branches. Each token
      # expires within an hour.
      - name: Get a release token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: Commit as the release App
        id: identity
        run: |
          name='${{ steps.app-token.outputs.app-slug }}[bot]'
          id=$(gh api "/users/${name}" --jq .id)
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo "email=${id}+${name}@users.noreply.github.com" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Pushes (the v0.0.0 tag below, and semantic-release's commit and tag) go out with the App token.
          token: ${{ steps.app-token.outputs.token }}

      - uses: ./.github/actions/setup

      # semantic-release numbers a first release 1.0.0. A v0.0.0 tag gives it a release to count from instead, so the
      # first `feat` publishes 0.1.0. Only ever runs while the repository has no version tag.
      #
      # GitHub refuses a push that puts a ref on a commit whose workflow files differ from the current ones unless the
      # token may edit workflows, which this one need not. So the tag goes on the oldest commit that has the workflow
      # files as they are now: the first commit, unless a workflow has changed since.
      - name: Start versioning at 0.x
        run: |
          if [ -z "$(git tag --list 'v*')" ]; then
            workflows="$(git rev-parse HEAD:.github/workflows)"
            start="$(git rev-parse HEAD)"
            for commit in $(git rev-list --first-parent HEAD); do
              [ "$(git rev-parse --quiet --verify "$commit:.github/workflows")" = "$workflows" ] || break
              start="$commit"
            done

            if [ -n "$(git rev-list --max-count=1 "$start^@")" ]; then
              echo "::warning::Versions are counted from ${start:0:7}, the last commit to change a workflow, not from the first commit: earlier commits do not count towards the first release. To count them, push a v0.0.0 tag to the first commit yourself."
            fi

            git tag v0.0.0 "$start"
            git push origin v0.0.0
          fi

      - name: Release the module
        id: module
        run: pnpm run release:module
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          # The default version lookup proxy, built into the release obscured (docs/developers/default-proxy.md).
          # Required: the release stops without them, rather than ship without a default proxy.
          EMMA_DEFAULT_PROXY_URL: ${{ vars.EMMA_DEFAULT_PROXY_URL }}
          EMMA_DEFAULT_PROXY_KEY: ${{ secrets.EMMA_DEFAULT_PROXY_KEY }}
          # The default package catalogue, likewise, and as required.
          EMMA_DEFAULT_CATALOGUE_URL: ${{ vars.EMMA_DEFAULT_CATALOGUE_URL }}
          EMMA_DEFAULT_CATALOGUE_KEY: ${{ secrets.EMMA_DEFAULT_CATALOGUE_KEY }}
          GIT_AUTHOR_NAME: ${{ steps.identity.outputs.name }}
          GIT_AUTHOR_EMAIL: ${{ steps.identity.outputs.email }}
          GIT_COMMITTER_NAME: ${{ steps.identity.outputs.name }}
          GIT_COMMITTER_EMAIL: ${{ steps.identity.outputs.email }}

      # After the module, so that it releases from the module's release commit, if there is one. Its releases are
      # pre-releases, so the latest release stays the module's.
      - name: Release the extension
        id: extension
        run: pnpm run release:extension
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          # An API key from addons.mozilla.org, to have Mozilla sign the Firefox build as an unlisted add-on. Without
          # it, the Firefox build is released unsigned, which Firefox installs only until it restarts.
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
          # EMMA's package catalogue and version lookup proxy, built into the EMMA extension obscured, as into the
          # module, and as required: the release stops without them.
          EMMA_DEFAULT_CATALOGUE_URL: ${{ vars.EMMA_DEFAULT_CATALOGUE_URL }}
          EMMA_DEFAULT_CATALOGUE_KEY: ${{ secrets.EMMA_DEFAULT_CATALOGUE_KEY }}
          EMMA_DEFAULT_PROXY_URL: ${{ vars.EMMA_DEFAULT_PROXY_URL }}
          EMMA_DEFAULT_PROXY_KEY: ${{ secrets.EMMA_DEFAULT_PROXY_KEY }}
          GIT_AUTHOR_NAME: ${{ steps.identity.outputs.name }}
          GIT_AUTHOR_EMAIL: ${{ steps.identity.outputs.email }}
          GIT_COMMITTER_NAME: ${{ steps.identity.outputs.name }}
          GIT_COMMITTER_EMAIL: ${{ steps.identity.outputs.email }}

  docs:
    name: Publish documentation
    needs: release
    if: ${{ needs.release.outputs.module-version != '' || needs.release.outputs.extension-version != '' }}
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/build-and-deploy-docs.yml

  sync-dev:
    name: Bring dev up to date
    needs: release
    if: ${{ needs.release.outputs.module-version != '' || needs.release.outputs.extension-version != '' }}
    runs-on: ubuntu-latest
    steps:
      # The release App is on the rulesets' bypass list, so its token may push to the protected branches. Each token
      # expires within an hour.
      - name: Get a release token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      # Fast-forwards dev onto the release commits. If dev has moved on, or the push is refused, opens a pull request from
      # main to dev instead (unless one is already open).
      - name: Merge main into dev
        run: |
          git fetch origin dev
          if git merge-base --is-ancestor origin/dev HEAD && git push origin HEAD:dev; then
            exit 0
          fi
          if gh pr list --base dev --head main --state open --json number --jq '.[0]' | grep -q .; then
            echo "A pull request from main to dev is already open."
            exit 0
          fi
          gh pr create --base dev --head main \
            --title "chore(release): merge the release back into dev" \
            --body "Brings the release commits (versions, changelogs, manifest) from main back into dev."
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
